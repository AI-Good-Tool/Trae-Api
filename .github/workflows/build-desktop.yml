name: Build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish installers to GitHub Releases after all checks pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: Windows-x64
            build: build:windows
            folder: windows
          - runner: macos-15
            target: macOS-arm64
            build: build:mac
            folder: mac
          - runner: macos-15-intel
            target: macOS-x64
            build: build:mac
            folder: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm run format:check
      - name: Install NSIS when needed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsisCompiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsisCompiler)) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
          }
      - run: npm run ${{ matrix.build }}
      - run: npm run smoke:desktop
      - name: Verify Windows installation and uninstallation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $setup = Get-ChildItem "dist/windows-$version/*-Setup.exe" | Select-Object -First 1
          $install = Join-Path $env:RUNNER_TEMP "TraeSwitchInstallSmoke"
          if (Test-Path $install) { throw "Smoke installation directory already exists" }
          $process = Start-Process $setup.FullName -ArgumentList "/S /D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installation failed" }
          $registry = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TraeSwitch"
          $expected = '"' + (Join-Path $install "Uninstall.exe") + '"'
          if ((Get-ItemProperty $registry).UninstallString -cne $expected) { throw "Invalid uninstall command" }
          $env:TRAE_SWITCH_SMOKE_EXECUTABLE = Join-Path $install "Trae Switch.exe"
          npm run smoke:desktop
          if ($LASTEXITCODE -ne 0) { throw "Installed app smoke test failed" }
          $process = Start-Process (Join-Path $install "Uninstall.exe") -ArgumentList "/S _?=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path $registry) -or (Test-Path (Join-Path $install "Trae Switch.exe"))) { throw "Uninstallation failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: Trae-Switch-${{ matrix.target }}
          path: |
            dist/${{ matrix.folder }}-*/*.dmg
            dist/${{ matrix.folder }}-*/*.exe
            dist/${{ matrix.folder }}-*/*.zip
            dist/${{ matrix.folder }}-*/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Trae-Switch-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Release tag does not match package version"; exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite update assets"; exit 1
          fi
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded"; exit 1
          fi
          for asset in "${assets[@]}"; do
            case "$asset" in
              *.sha256) (cd "$(dirname "$asset")" && sha256sum --check "$(basename "$asset")") ;;
              *.dmg|*.exe|*.zip) test -f "$asset.sha256" ;;
              *) echo "Unexpected release asset: $asset"; exit 1 ;;
            esac
          done
          gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "Trae Switch $tag" --generate-notes
